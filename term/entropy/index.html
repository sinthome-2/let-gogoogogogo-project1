  <h1>Entropy</h1>
  <div class="chinese-name">熵</div>

  <h2>定义</h2>
  <p>源于热力学和信息论的概念，衡量系统的不确定性或信息量。在机器学习中，交叉熵常用于分类任务的损失函数。</p>

  <h2>示例</h2>
<ul>
  <li>信息论中，熵越高表示不确定性越大。</li>
  <li>交叉熵损失衡量模型分布与真实分布的差异。</li>
  <li>决策树使用信息增益（基于熵）选择分裂特征。</li>
</ul>
