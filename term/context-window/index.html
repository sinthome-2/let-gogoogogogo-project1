  <h1>Context Window</h1>
  <div class="chinese-name">上下文窗口</div>

  <h2>定义</h2>
  <p>模型在一次推理中能够同时&#39;看到&#39;的最大输入长度，通常以 token 数量衡量。超过窗口长度的内容会被截断或忽略。</p>

  <h2>示例</h2>
<ul>
  <li>某模型的 context window 是 128K token，意味着它能一次处理很长的文档。</li>
  <li>长对话应用需要较大的 context window 才能记住更早的上下文。</li>
  <li>如果输入太长，需要先压缩或分段处理。</li>
</ul>
