  <h1>Role Prompting</h1>
  <div class="chinese-name">角色提示</div>

  <h2>定义</h2>
  <p>在 prompt 中让模型扮演特定角色（如专家、教师、程序员），以引导输出风格、深度和视角的提示技巧。</p>

  <h2>示例</h2>
<ul>
  <li>&#39;你是一位资深 Python 工程师，请review这段代码&#39;。</li>
  <li>角色提示能让回答更专业、更有针对性。</li>
  <li>可以与 system prompt 结合使用。</li>
</ul>
