  <h1>Embedding</h1>
  <div class="chinese-name">嵌入</div>

  <h2>定义</h2>
  <p>将文本、图像等数据转换为高维数值向量的表示方式。语义相近的内容在向量空间中距离更近。</p>

  <h2>示例</h2>
<ul>
  <li>&#39;国王&#39;与&#39;女王&#39;的 embedding 在向量空间中很接近。</li>
  <li>RAG 系统常用 embedding 来检索相关文档。</li>
  <li>Embedding 可用于语义搜索、聚类和推荐。</li>
</ul>
