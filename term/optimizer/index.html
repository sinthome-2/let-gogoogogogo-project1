  <h1>Optimizer</h1>
  <div class="chinese-name">优化器</div>

  <h2>定义</h2>
  <p>用于更新模型参数以最小化损失函数的算法。常见优化器包括 SGD、Adam、AdamW 等。</p>

  <h2>示例</h2>
<ul>
  <li>Adam 优化器能自适应调整每个参数的学习率。</li>
  <li>AdamW 是 Adam 的改进版，更好地处理权重衰减。</li>
  <li>选择优化器会影响训练速度和最终模型质量。</li>
</ul>
