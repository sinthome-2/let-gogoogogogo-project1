  <h1>Few-shot</h1>
  <div class="chinese-name">少样本学习</div>

  <h2>定义</h2>
  <p>在 prompt 中提供几个输入-输出示例，让模型理解任务模式并泛化到新输入。相比零样本（zero-shot），few-shot 通常能获得更稳定的结果。</p>

  <h2>示例</h2>
<ul>
  <li>给出三个中文→英文翻译示例，再让模型翻译新句子。</li>
  <li>用 few-shot 让模型学会特定的分类标准。</li>
  <li>示例质量比数量更重要，通常 2-5 个高质量示例就足够。</li>
</ul>
