  <div class="chinese-name">基准测试</div>

  <h2>定义</h2>
  <p>用于标准化评估模型能力的测试数据集和评分方法。Benchmark 让不同模型在相同任务上具有可比性。</p>

  <h2>示例</h2>
<ul>
  <li>MMLU 是评估大模型多学科知识的常见 benchmark。</li>
  <li>HumanEval 用于评估代码生成能力。</li>
  <li>benchmark 得分高不等于实际体验好，需要结合实际场景判断。</li>
</ul>
