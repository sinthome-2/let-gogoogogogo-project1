  <h1>Reinforcement Learning</h1>
  <div class="chinese-name">强化学习</div>

  <h2>定义</h2>
  <p>一种机器学习范式，智能体通过与环境交互、获得奖励或惩罚来学习最优行为策略。RLHF 就是强化学习在 LLM 对齐中的应用。</p>

  <h2>示例</h2>
<ul>
  <li>AlphaGo 使用强化学习击败人类围棋冠军。</li>
  <li>强化学习常用于游戏、机器人控制和推荐系统。</li>
  <li>奖励函数设计是强化学习的关键挑战。</li>
</ul>
