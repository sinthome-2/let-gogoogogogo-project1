  <h1>Reward Model</h1>
  <div class="chinese-name">奖励模型</div>

  <h2>定义</h2>
  <p>在 RLHF 中，用来评估模型输出好坏并输出标量分数的模型。奖励模型指导强化学习过程，使生成模型偏向人类偏好的输出。</p>

  <h2>示例</h2>
<ul>
  <li>奖励模型根据人类偏好数据训练得到。</li>
  <li>它本身不生成文本，只给文本打分。</li>
  <li>奖励模型可能出现奖励黑客（reward hacking）问题。</li>
</ul>
