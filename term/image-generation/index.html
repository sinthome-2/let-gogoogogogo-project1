  <div class="chinese-name">图像生成</div>

  <h2>定义</h2>
  <p>根据文本描述、草图或其他输入自动生成图像的 AI 任务。扩散模型（diffusion model）是当前主流方法。</p>

  <h2>示例</h2>
<ul>
  <li>Midjourney、Stable Diffusion、DALL-E 都是图像生成模型。</li>
  <li>输入&#39;一只穿着宇航服的猫&#39;即可生成对应图片。</li>
  <li>图像生成涉及版权、真实性和伦理争议。</li>
</ul>
