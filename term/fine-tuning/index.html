  <h1>Fine-tuning</h1>
  <div class="chinese-name">微调</div>

  <h2>定义</h2>
  <p>在预训练好的模型基础上，使用特定领域或任务的小规模数据继续训练，使模型更适合特定用途。</p>

  <h2>示例</h2>
<ul>
  <li>用医学文献微调通用 LLM，使其更擅长回答医学问题。</li>
  <li>微调可以让模型学会特定的语气或格式。</li>
  <li>相比从头训练，微调成本更低、速度更快。</li>
</ul>
