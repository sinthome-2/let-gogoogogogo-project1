  <h1>Skill</h1>
  <div class="chinese-name">能力</div>

  <h2>定义</h2>
  <p>模型在特定任务上表现出的稳定能力，通常通过微调（fine-tuning）或强化学习（RLHF）获得。一个模型可能具备多个 skill，例如代码生成、多语言翻译或逻辑推理。</p>

  <h2>示例</h2>
<ul>
  <li>代码生成 skill：根据自然语言描述输出可运行代码。</li>
  <li>多语言翻译 skill：在多种语言之间进行高质量互译。</li>
  <li>指令遵循 skill：理解并执行用户给出的复杂指令。</li>
</ul>
