  <p>用于训练或评估语言模型的大规模文本集合。语料库的质量、规模和多样性直接影响模型能力。</p>

<ul>

  <li>Wikipedia、书籍、新闻等常被用作高质量语料。</li>
  <li>语料库需要清洗以去除低质量或有害内容。</li>
</ul>
