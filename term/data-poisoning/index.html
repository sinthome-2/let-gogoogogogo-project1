  <h1>Data Poisoning</h1>
  <div class="chinese-name">数据投毒</div>

  <h2>定义</h2>
  <p>通过在训练数据中注入恶意样本，使模型学习到错误行为或产生特定偏差的攻击方式。</p>

  <h2>示例</h2>
<ul>
  <li>在训练语料中插入特定模式的错误标签。</li>
  <li>数据投毒可能让模型对某类输入产生系统性误判。</li>
  <li>防御数据投毒需要严格的数据来源审核和异常检测。</li>
</ul>
