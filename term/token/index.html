  <h1>Token</h1>
  <div class="chinese-name">词元</div>

  <h2>定义</h2>
  <p>模型处理文本时的最小单位，可以是单词、子词或字符。模型按 token 计费、限制上下文长度并生成输出。</p>

  <h2>示例</h2>
<ul>
  <li>英文中一个 token 大约等于 0.75 个单词。</li>
  <li>&#39;ChatGPT&#39; 可能被切分为多个 token。</li>
  <li>API 通常按输入和输出的 token 总数收费。</li>
</ul>
