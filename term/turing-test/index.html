  <h1>Turing Test</h1>
  <div class="chinese-name">图灵测试</div>

  <h2>定义</h2>
  <p>由艾伦·图灵提出的测试：如果人类评估者无法通过文本对话区分机器和真人，则认为机器具有智能。图灵测试是人工智能的经典思想实验。</p>

  <h2>示例</h2>
<ul>
  <li>现代 chatbot 在某种程度上能通过简化的图灵测试。</li>
  <li>图灵测试因只关注行为表现而受到批评。</li>
  <li>它仍是讨论机器智能时的常用参考框架。</li>
</ul>
