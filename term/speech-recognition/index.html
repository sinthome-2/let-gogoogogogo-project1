  <div class="chinese-name">语音识别</div>

  <h2>定义</h2>
  <p>将人类语音转换为文本的 AI 任务。语音识别是语音助手、实时字幕、会议转写等应用的基础。</p>

  <h2>示例</h2>
<ul>
  <li>Siri、Alexa、科大讯飞都依赖语音识别。</li>
  <li>ASR 需要处理口音、噪声和口语化表达。</li>
  <li>多模态模型可把语音直接转为文字并理解语义。</li>
</ul>
