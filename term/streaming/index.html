  <h1>Streaming</h1>
  <div class="chinese-name">流式输出</div>

  <h2>定义</h2>
  <p>模型生成一个 token 就立即返回一个 token，而不是等全部生成完毕再返回。流式输出能显著改善用户体验。</p>

  <h2>示例</h2>
<ul>
  <li>ChatGPT 的打字机效果就是基于 streaming。</li>
  <li>Streaming 降低了用户等待第一个字符的时间。</li>
  <li>前端需要逐段接收并渲染流式数据。</li>
</ul>
