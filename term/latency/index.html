  <h1>Latency</h1>
  <div class="chinese-name">延迟</div>

  <h2>定义</h2>
  <p>从发送请求到收到模型响应所经历的时间。低延迟对实时交互应用（如聊天、语音助手）至关重要。</p>

  <h2>示例</h2>
<ul>
  <li>首 token 延迟指用户输入后到模型输出第一个 token 的时间。</li>
  <li>流式输出可以降低用户感知的延迟。</li>
  <li>模型越大，延迟通常越高。</li>
</ul>
