  <h1>Human-in-the-Loop</h1>
  <div class="chinese-name">人在回路</div>

  <h2>定义</h2>
  <p>在 AI 系统决策或执行过程中保留人类审核和干预环节的流程设计。它能提高可靠性、安全性和用户信任。</p>

  <h2>示例</h2>
<ul>
  <li>医疗诊断 AI 给出建议后由医生做最终判断。</li>
  <li>内容审核系统先由 AI 初筛，再由人工复核。</li>
  <li>Human-in-the-loop 是高风险场景的常见做法。</li>
</ul>
