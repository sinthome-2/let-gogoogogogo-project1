  <h2>定义</h2>
  <p>能够感知环境、自主决策并调用工具完成目标的 AI 系统。Agent 不仅能生成文本，还能执行代码、查询数据库、浏览网页等。</p>

  <h2>示例</h2>
<ul>
  <li>能自动订机票、查天气并写行程的 AI 助手。</li>
  <li>代码 Agent 可以读取文件、运行测试并修复 bug。</li>
  <li>Agent 通常由 LLM 作为&#39;大脑&#39;，配合工具链使用。</li>
</ul>
