  <h1>RLHF</h1>
  <div class="chinese-name">基于人类反馈的强化学习</div>

  <h2>定义</h2>
  <p>一种训练方法：先让人类对模型的多个输出打分或排序，再用强化学习让模型倾向于生成人类更喜欢的回答。ChatGPT 等模型普遍采用 RLHF 进行对齐。</p>

  <h2>示例</h2>
<ul>
  <li>RLHF 让模型学会拒绝回答有害请求。</li>
  <li>人类标注员会比较两个回答，选出更好的一个。</li>
  <li>RLHF 是对齐（alignment）的核心技术之一。</li>
</ul>
