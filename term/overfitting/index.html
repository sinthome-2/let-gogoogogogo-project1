  <h1>Overfitting</h1>
  <div class="chinese-name">过拟合</div>

  <h2>定义</h2>
  <p>模型在训练数据上表现很好，但在未见过的测试数据上表现很差的现象。过拟合通常是因为模型过于复杂或训练数据太少。</p>

  <h2>示例</h2>
<ul>
  <li>模型记住了训练集中的噪声而不是学到通用规律。</li>
  <li>增加数据量、使用正则化可以缓解过拟合。</li>
  <li>过拟合是机器学习中需要持续警惕的问题。</li>
</ul>
