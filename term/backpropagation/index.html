  <h1>Backpropagation</h1>
  <div class="chinese-name">反向传播</div>

  <h2>定义</h2>
  <p>一种高效计算神经网络中每个参数梯度的算法。它从输出层开始，将误差逐层反向传播，从而指导参数更新。</p>

  <h2>示例</h2>
<ul>
  <li>反向传播让深层网络训练成为可能。</li>
  <li>它结合链式法则计算复合函数的梯度。</li>
  <li>几乎所有现代神经网络都依赖反向传播。</li>
</ul>
