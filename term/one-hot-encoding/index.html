  <h1>One-hot Encoding</h1>
  <div class="chinese-name">独热编码</div>

  <h2>定义</h2>
  <p>将离散类别转换为只有一个位置为 1、其余为 0 的向量的表示方法。简单但稀疏，不适合表示词汇间语义关系。</p>

  <h2>示例</h2>
<ul>
  <li>词汇表有 5 万个词时，one-hot 向量长度也是 5 万。</li>
  <li>One-hot 无法表达&#39;国王&#39;和&#39;女王&#39;之间的语义相似性。</li>
  <li>Embedding 是 one-hot 的密集、低维替代方案。</li>
</ul>
