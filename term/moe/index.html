  <h1>MoE</h1>
  <div class="chinese-name">混合专家模型</div>

  <h2>定义</h2>
  <p>一种模型架构，将前馈网络拆分为多个专家子网络，并通过门控机制为每个输入选择激活部分专家。MoE 能在不显著增加推理成本的情况下扩大模型容量。</p>

  <h2>示例</h2>
<ul>
  <li>Mixtral 8x7B 使用了 MoE 架构，每次只激活部分专家。</li>
  <li>MoE 让模型参数规模很大，但每次推理计算量相对可控。</li>
  <li>专家路由是 MoE 模型的关键设计挑战。</li>
</ul>
