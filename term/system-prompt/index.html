  <h1>System Prompt</h1>
  <div class="chinese-name">系统提示</div>

  <h2>定义</h2>
  <p>在对话开始处设置的全局性指令，用于定义模型的角色、行为准则、输出格式或安全边界。用户通常看不到 system prompt。</p>

  <h2>示例</h2>
<ul>
  <li>&#39;你是一位 helpful 的编程助手&#39;就是一个 system prompt。</li>
  <li>System prompt 可以规定模型必须拒绝哪些请求。</li>
  <li>同一个模型在不同产品中的性格差异常由 system prompt 决定。</li>
</ul>
