  <h1>Singularity</h1>
  <div class="chinese-name">技术奇点</div>

  <h2>定义</h2>
  <p>假想的未来时刻：人工智能能力发生递归式自我改进，导致技术和社会发生不可预测的根本性变革。Singularity 更多是一个思想实验而非科学共识。</p>

  <h2>示例</h2>
<ul>
  <li>如果 AI 能设计比自身更强大的 AI，可能触发奇点。</li>
  <li>奇点假设引发了对控制和安全的深刻讨论。</li>
  <li>并非所有研究者都认为奇点必然发生。</li>
</ul>
