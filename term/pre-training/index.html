  <h1>Pre-training</h1>
  <div class="chinese-name">预训练</div>

  <h2>定义</h2>
  <p>在大型通用数据集上对模型进行初步训练，使其学习语言结构、世界知识和通用表示。预训练后的模型通常需要微调才能用于具体任务。</p>

  <h2>示例</h2>
<ul>
  <li>GPT 通过在海量文本上做 next-token prediction 进行预训练。</li>
  <li>预训练成本很高，但只需进行一次。</li>
  <li>预训练让模型具备通用语言能力，微调让它适应专业领域。</li>
</ul>
