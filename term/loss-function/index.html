  <h1>Loss Function</h1>
  <div class="chinese-name">损失函数</div>

  <h2>定义</h2>
  <p>衡量模型预测与真实目标之间差距的函数。训练过程就是不断最小化损失函数值的过程。</p>

  <h2>示例</h2>
<ul>
  <li>分类任务常用交叉熵损失（cross-entropy loss）。</li>
  <li>回归任务常用均方误差（MSE）。</li>
  <li>损失函数的选择会影响模型学习的目标。</li>
</ul>
