  <h1>Emergent Ability</h1>
  <div class="chinese-name">涌现能力</div>

  <h2>定义</h2>
  <p>随模型规模、数据量或训练计算量增长而突然出现的能力，这些能力在较小模型中并不存在或表现很弱。</p>

  <h2>示例</h2>
<ul>
  <li>大语言模型在参数达到一定规模后突然展现出链式推理能力。</li>
  <li>多步算术题准确率随模型变大而陡升。</li>
  <li>某些翻译能力在中小模型中几乎不存在，在大模型中突然显现。</li>
</ul>
