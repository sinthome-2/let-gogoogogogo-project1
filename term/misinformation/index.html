  <h1>Misinformation</h1>
  <div class="chinese-name">错误信息</div>

  <h2>定义</h2>
  <p>有意或无意传播的不准确或误导性信息。生成式 AI 降低了制造和传播虚假内容的成本，加剧了 misinformation 风险。</p>

  <h2>示例</h2>
<ul>
  <li>AI 生成的虚假新闻或伪造图片可能误导公众。</li>
  <li>Hallucination 可能导致模型输出错误信息。</li>
  <li>打击 misinformation 需要技术检测和媒体素养教育。</li>
</ul>
