  <h1>RAG</h1>
  <div class="chinese-name">检索增强生成</div>

  <h2>定义</h2>
  <p>一种结合信息检索与文本生成的技术：先在外部知识库中检索相关文档，再让模型基于检索结果生成回答，从而减少幻觉并回答时效性问题。</p>

  <h2>示例</h2>
<ul>
  <li>企业内部问答系统用 RAG 基于私有文档回答员工问题。</li>
  <li>RAG 让模型能引用最新新闻，而不是只依赖训练数据。</li>
  <li>向量数据库是 RAG 系统常用的检索后端。</li>
</ul>
