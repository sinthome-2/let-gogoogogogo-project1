  <h1>Prompt</h1>
  <div class="chinese-name">提示</div>

  <h2>定义</h2>
  <p>用户输入给生成式 AI 模型的文本、图像或其他形式的指令或上下文，用于引导模型产生期望的输出。</p>

  <h2>示例</h2>
<ul>
  <li>&#39;请用三句话总结以下文章&#39; 是一个简单的文本 prompt。</li>
  <li>Chain-of-Thought prompt 会在问题后加上&#39;请逐步思考&#39;。</li>
  <li>多模态 prompt 可能同时包含图片和文字说明。</li>
</ul>
