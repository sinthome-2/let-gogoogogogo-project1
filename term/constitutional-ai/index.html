  <h1>Constitutional AI</h1>
  <div class="chinese-name">宪法 AI</div>

  <h2>定义</h2>
  <p>Anthropic 提出的一种对齐方法：让模型遵循一套事先写好的原则（&#39;宪法&#39;），通过自我批评和修正来减少有害输出。</p>

  <h2>示例</h2>
<ul>
  <li>Claude 的训练使用了 Constitutional AI。</li>
  <li>模型会被要求根据宪法原则评估并改进自己的回答。</li>
  <li>宪法 AI 旨在减少对人类标注有害内容的依赖。</li>
</ul>
