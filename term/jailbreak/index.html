  <div class="chinese-name">越狱</div>

  <h2>定义</h2>
  <p>通过精心构造的 prompt 绕过模型的安全限制，使其生成原本应该拒绝的内容。Jailbreak 是红队测试和安全研究的重要对象。</p>

  <h2>示例</h2>
<ul>
  <li>让模型扮演某个角色以绕过内容政策。</li>
  <li>把有害请求编码成谜语或翻译任务。</li>
  <li>通过持续对话逐步诱导模型突破限制。</li>
</ul>
