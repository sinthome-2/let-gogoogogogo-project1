  <h1>Human Evaluation</h1>
  <div class="chinese-name">人工评估</div>

  <h2>定义</h2>
  <p>由人类标注员对模型输出进行质量、有用性、安全性或流畅性等方面评分的方法。人工评估通常被认为是最可靠的评估方式，但成本较高。</p>

  <h2>示例</h2>
<ul>
  <li>RLHF 中的人类偏好比较就是人工评估的一种。</li>
  <li>人工评估可以捕捉自动指标难以衡量的细微差别。</li>
  <li>大规模人工评估常用于发布前的最终验证。</li>
</ul>
