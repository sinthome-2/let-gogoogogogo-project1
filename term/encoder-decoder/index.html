  <h1>Encoder-Decoder</h1>
  <div class="chinese-name">编码器-解码器</div>

  <h2>定义</h2>
  <p>一种神经网络架构，编码器把输入压缩为隐表示，解码器再根据该表示生成输出。常用于机器翻译、文本摘要等序列到序列任务。</p>

  <h2>示例</h2>
<ul>
  <li>原始 Transformer 论文提出的就是 encoder-decoder 结构。</li>
  <li>BERT 主要使用编码器，GPT 主要使用解码器。</li>
  <li>机器翻译中，编码器理解源语言，解码器生成目标语言。</li>
</ul>
