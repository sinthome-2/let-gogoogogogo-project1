  <h2>定义</h2>
  <p>常用于评估文本摘要质量的指标，侧重于召回率，衡量生成摘要与参考摘要之间的重叠程度。</p>

  <h2>示例</h2>
<ul>
  <li>ROUGE-1 比较 unigram 重叠，ROUGE-2 比较 bigram。</li>
  <li>ROUGE 高不一定代表摘要流畅或可读。</li>
  <li>摘要评估还需结合人工判断。</li>
</ul>
