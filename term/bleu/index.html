  <h1>BLEU</h1>
  

  <h2>定义</h2>
  <p>常用于评估机器翻译和文本生成质量的指标，通过比较生成文本与参考文本之间的 n-gram 重叠程度来打分。</p>

  <h2>示例</h2>
<ul>
  <li>BLEU 得分高说明生成结果与参考答案用词接近。</li>
  <li>BLEU 对同义词不敏感，可能低估语义相近的表达。</li>
  <li>它常与人工评估结合使用。</li>
</ul>
