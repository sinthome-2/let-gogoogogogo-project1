  <h1>API</h1>
  <div class="chinese-name">应用程序接口</div>

  <h2>定义</h2>
  <p>一组允许不同软件之间互相通信的接口规范。在 AI 领域，API 通常指调用模型服务的方式。</p>

  <h2>示例</h2>
<ul>
  <li>开发者通过 OpenAI API 向 GPT-4 发送 prompt 并获取回复。</li>
  <li>API 让非 AI 专家也能把大模型能力集成到自己的应用中。</li>
  <li>API 调用通常需要密钥（API key）并按用量计费。</li>
</ul>
