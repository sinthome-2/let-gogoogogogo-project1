  <h1>Harmfulness</h1>
  <div class="chinese-name">危害性</div>

  <h2>定义</h2>
  <p>模型输出或行为对用户、社会或环境造成负面影响的潜在程度。评估 harmfulness 是 AI 安全研究的核心任务之一。</p>

  <h2>示例</h2>
<ul>
  <li>生成歧视性、仇恨或误导性内容。</li>
  <li>输出可能用于制造危险物品或实施攻击的指令。</li>
  <li>在医疗或法律等高风险领域给出错误建议。</li>
</ul>
