  <h1>Machine Translation</h1>
  <div class="chinese-name">机器翻译</div>

  <h2>定义</h2>
  <p>使用计算机自动将一种自然语言转换为另一种语言的任务。神经网络尤其是 Transformer 大幅提升了机器翻译质量。</p>

  <h2>示例</h2>
<ul>
  <li>Google Translate、DeepL 都基于神经网络翻译。</li>
  <li>LLM 也能完成高质量的多语言翻译。</li>
  <li>机器翻译需要考虑语境、文化和专业术语。</li>
</ul>
