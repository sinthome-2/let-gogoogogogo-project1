  <h1>Symbolic AI</h1>
  <div class="chinese-name">符号主义 AI</div>

  <h2>定义</h2>
  <p>基于显式符号、规则和逻辑推理的人工智能范式。与基于数据驱动的神经网络不同，符号 AI 强调可解释的知识表示和推理。</p>

  <h2>示例</h2>
<ul>
  <li>专家系统是符号 AI 的典型应用。</li>
  <li>符号 AI 在逻辑清晰、规则明确的任务上表现好。</li>
  <li>神经-符号结合是当前研究热点之一。</li>
</ul>
