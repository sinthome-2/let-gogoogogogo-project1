  <h1>Regularization</h1>
  <div class="chinese-name">正则化</div>

  <h2>定义</h2>
  <p>用于防止模型过拟合的技术，通过在损失函数中加入惩罚项或随机丢弃神经元等方式，限制模型复杂度。</p>

  <h2>示例</h2>
<ul>
  <li>L2 正则化会惩罚过大的权重值。</li>
  <li>Dropout 是一种常用的神经网络正则化方法。</li>
  <li>正则化让模型更可能学到泛化规律。</li>
</ul>
