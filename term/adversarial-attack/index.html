  <h1>Adversarial Attack</h1>
  <div class="chinese-name">对抗攻击</div>

  <h2>定义</h2>
  <p>通过对输入添加微小、人眼难以察觉的扰动，使模型产生错误输出的攻击方式。研究对抗攻击有助于提升模型鲁棒性。</p>

  <h2>示例</h2>
<ul>
  <li>在图片上添加微小噪声，就能让图像分类器把熊猫识别为长臂猿。</li>
  <li>对抗攻击在 NLP 中常以同义词替换或特殊字符形式出现。</li>
  <li>防御对抗攻击是 AI 安全的重要方向。</li>
</ul>
