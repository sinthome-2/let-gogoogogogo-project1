  <div class="chinese-name">多模态</div>

  <h2>定义</h2>
  <p>能够同时处理并理解多种类型数据（如文本、图像、音频、视频）的 AI 系统或模型。</p>

  <h2>示例</h2>
<ul>
  <li>GPT-4o 可以同时接收图片和文字并给出描述。</li>
  <li>多模态模型能根据草图生成网页代码。</li>
  <li>语音识别和图像描述都是多模态任务。</li>
</ul>
