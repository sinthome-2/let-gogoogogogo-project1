  <h1>Job Displacement</h1>
  <div class="chinese-name">就业岗位替代</div>

  <h2>定义</h2>
  <p>由于技术进步，尤其是自动化和 AI，导致部分工作岗位被机器取代的现象。</p>

  <h2>示例</h2>
<ul>
  <li>AI 可能替代部分翻译、客服、基础编程岗位。</li>
  <li>历史上新技术也创造了新职业。</li>
  <li>应对 job displacement 需要教育、再培训和社会保障政策。</li>
</ul>
