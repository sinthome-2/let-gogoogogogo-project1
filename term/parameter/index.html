  <h1>Parameter</h1>
  <div class="chinese-name">参数</div>

  <h2>定义</h2>
  <p>神经网络中可学习的权重数值，决定了模型如何处理输入并生成输出。参数量通常被用来衡量模型规模。</p>

  <h2>示例</h2>
<ul>
  <li>GPT-3 约有 1750 亿参数。</li>
  <li>参数越多，模型通常能记住更多知识、表达更复杂的模式。</li>
  <li>模型文件大小主要由参数量和数值精度决定。</li>
</ul>
